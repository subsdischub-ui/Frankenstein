openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /frankenstein/models:
    post:
      operationId: importNativeModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NativeModelInput" }
      responses:
        "200":
          description: Candidat importé pour scoring shadow seulement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /frankenstein/models/{id}:
    delete:
      operationId: retireNativeModel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candidat retiré du shadow, historique conservé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /frankenstein/snapshot:
    get:
      operationId: getSnapshot
      responses:
        "200":
          description: Etat du laboratoire (portefeuille personnel si connecté)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
  /frankenstein/control:
    post:
      operationId: controlEngine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControlInput" }
      responses:
        "200":
          description: Commande enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /frankenstein/scan:
    post:
      operationId: scanMarket
      responses:
        "200":
          description: Scan effectué ou indisponibilité explicite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /frankenstein/replay:
    post:
      operationId: runReplay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayInput" }
      responses:
        "200":
          description: Replay isolé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
  /frankenstein/experiments:
    get:
      operationId: listExperiments
      responses:
        "200":
          description: Registre des expériences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Experiment" }
  /frankenstein/proposals:
    post:
      operationId: createProposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalInput" }
      responses:
        "200":
          description: Proposition de recherche enregistrée sans promotion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /frankenstein/audits:
    get:
      operationId: getAudits
      responses:
        "200":
          description: Six revues et documentation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Audit" }
  /frankenstein/export:
    get:
      operationId: exportJournal
      responses:
        "200":
          description: Journal et dataset exportable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportBundle" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ControlInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [start, pause, halt] }
    ControlInputMode:
      type: string
      enum: [paper]
    ActionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    ReplayInput:
      type: object
      additionalProperties: false
      required: [source, strategy]
      properties:
        source: { type: string, enum: [demo, import] }
        strategy: { type: string, enum: [momentum, trend, hybrid, filtered] }
        symbol: { type: string, pattern: '^[A-Z0-9]{2,20}USDT$' }
        candles:
          type: array
          minItems: 250
          maxItems: 20000
          items: { $ref: "#/components/schemas/Candle" }
        btcCandles:
          type: array
          minItems: 250
          maxItems: 20000
          items: { $ref: "#/components/schemas/Candle" }
        derivativeObservations:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/DerivativeObservation" }
        parameters: { $ref: "#/components/schemas/ProposalInput" }
    NativeModelInput:
      type: object
      additionalProperties: false
      required: [nativeModel, manifest]
      properties:
        nativeModel: { type: string, maxLength: 3000000 }
        manifest:
          type: object
          additionalProperties: true
    NativeModelSummary:
      type: object
      required: [id, hash, createdAt, status, features, threshold]
      properties:
        id: { type: string }
        hash: { type: string }
        createdAt: { type: string }
        status: { type: string, enum: [SHADOW_UNVERIFIED, RETIRED] }
        features:
          type: array
          items: { type: string }
        threshold: { type: number }
    DerivativeObservation:
      type: object
      required: [time, deltaOi, fundingRate]
      additionalProperties: false
      properties:
        time: { type: number }
        deltaOi: { type: number }
        fundingRate: { type: number }
    Candle:
      type: object
      additionalProperties: false
      required: [time, open, high, low, close, volume, quoteVolume, takerBuy]
      properties:
        time: { type: number }
        open: { type: number, exclusiveMinimum: 0 }
        high: { type: number, exclusiveMinimum: 0 }
        low: { type: number, exclusiveMinimum: 0 }
        close: { type: number, exclusiveMinimum: 0 }
        volume: { type: number, minimum: 0 }
        quoteVolume: { type: number, minimum: 0 }
        takerBuy: { type: number, minimum: 0 }
    ProposalInput:
      type: object
      additionalProperties: false
      required: [volumeRatio, rsiMax, expiryBars]
      properties:
        volumeRatio: { type: number, minimum: 1.5, maximum: 5 }
        rsiMax: { type: number, minimum: 25, maximum: 50 }
        expiryBars: { type: integer, minimum: 8, maximum: 48 }
    Portfolio:
      type: object
      required: [initialCapital, cash, equity, realizedPnl, unrealizedPnl, fees, exposure, drawdown, openRisk, closedTrades, winRate]
      properties:
        initialCapital: { type: number }
        cash: { type: number }
        equity: { type: number }
        realizedPnl: { type: number }
        unrealizedPnl: { type: number }
        fees: { type: number }
        exposure: { type: number }
        drawdown: { type: number }
        openRisk: { type: number }
        closedTrades: { type: integer }
        winRate: { type: ["number", "null"] }
    MarketAsset:
      type: object
      required: [symbol, price, change24h, quoteVolume, volumeRatio, relativeStrength, state, reasons, updatedAt]
      properties:
        symbol: { type: string }
        price: { type: number }
        change24h: { type: number }
        quoteVolume: { type: number }
        volumeRatio: { type: ["number", "null"] }
        relativeStrength: { type: ["number", "null"] }
        state: { type: string }
        reasons:
          type: array
          items: { type: string }
        updatedAt: { type: string }
    Trade:
      type: object
      required: [id, symbol, status, entry, stop, target, quantity, mark, fees, pnl, openedAt, closedAt, exitReason, version, source]
      properties:
        id: { type: string }
        symbol: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        entry: { type: number }
        stop: { type: number }
        target: { type: number }
        quantity: { type: number }
        mark: { type: number }
        fees: { type: number }
        pnl: { type: number }
        openedAt: { type: string }
        closedAt: { type: ["string", "null"] }
        exitReason: { type: ["string", "null"] }
        version: { type: string }
        source: { type: string }
    Decision:
      type: object
      required: [id, symbol, time, accepted, reasons, score, features, outcome]
      properties:
        id: { type: string }
        symbol: { type: string }
        time: { type: string }
        accepted: { type: boolean }
        reasons:
          type: array
          items: { type: string }
        score: { type: ["number", "null"] }
        features:
          type: object
          additionalProperties: { type: number }
        outcome: { type: ["string", "null"] }
        shadowScore: { type: ["number", "null"] }
        shadowModelId: { type: ["string", "null"] }
    Activity:
      type: object
      required: [id, time, type, message]
      properties:
        id: { type: string }
        time: { type: string }
        type: { type: string }
        message: { type: string }
    EquityPoint:
      type: object
      required: [time, equity]
      properties:
        time: { type: string }
        equity: { type: number }
    EngineStatus:
      type: object
      required: [mode, running, halted, authenticated, feedStatus, feedMessage, lastScan, heartbeat, baselineVersion, modelStatus, nextCycleSeconds]
      properties:
        mode: { type: string, enum: [paper] }
        running: { type: boolean }
        halted: { type: boolean }
        authenticated: { type: boolean }
        feedStatus: { type: string, enum: [waiting, healthy, stale, unavailable] }
        feedMessage: { type: string }
        lastScan: { type: ["string", "null"] }
        heartbeat: { type: string }
        baselineVersion: { type: string }
        modelStatus: { type: string }
        nextCycleSeconds: { type: integer }
    RiskConfig:
      type: object
      required: [riskPerTrade, maxOpenRisk, maxPositions, maxExposure, maxAssetExposure, dailyLossLimit, drawdownLimit, feeRate, slippageRate, rewardRisk, maxHoldingHours]
      properties:
        riskPerTrade: { type: number }
        maxOpenRisk: { type: number }
        maxPositions: { type: integer }
        maxExposure: { type: number }
        maxAssetExposure: { type: number }
        dailyLossLimit: { type: number }
        drawdownLimit: { type: number }
        feeRate: { type: number }
        slippageRate: { type: number }
        rewardRisk: { type: number }
        maxHoldingHours: { type: number }
    Snapshot:
      type: object
      required: [engine, portfolio, risk, assets, trades, decisions, activity, equityCurve, nativeModels, proposals]
      properties:
        engine: { $ref: "#/components/schemas/EngineStatus" }
        portfolio: { $ref: "#/components/schemas/Portfolio" }
        risk: { $ref: "#/components/schemas/RiskConfig" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/MarketAsset" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        equityCurve:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
        nativeModels:
          type: array
          items: { $ref: "#/components/schemas/NativeModelSummary" }
        proposals:
          type: array
          items:
            type: object
            required: [id, createdAt, params, status]
            properties:
              id: { type: string }
              createdAt: { type: string }
              params: { $ref: "#/components/schemas/ProposalInput" }
              status: { type: string }
    Experiment:
      type: object
      required: [id, createdAt, source, strategy, status, trades, pnl, fees, drawdown, expectancy, confidenceLow, confidenceHigh, equityCurve, journal, notes, dataHash, comparisons]
      properties:
        id: { type: string }
        createdAt: { type: string }
        source: { type: string }
        strategy: { type: string }
        status: { type: string }
        trades: { type: integer }
        pnl: { type: number }
        fees: { type: number }
        drawdown: { type: number }
        expectancy: { type: ["number", "null"] }
        confidenceLow: { type: ["number", "null"] }
        confidenceHigh: { type: ["number", "null"] }
        equityCurve:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
        journal:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        notes:
          type: array
          items: { type: string }
        dataHash: { type: string }
        comparisons:
          type: array
          items: { $ref: "#/components/schemas/Comparison" }
    Comparison:
      type: object
      required: [strategy, trades, pnl, drawdown]
      properties:
        strategy: { type: string }
        trades: { type: integer }
        pnl: { type: number }
        drawdown: { type: number }
    Audit:
      type: object
      required: [id, title, attack, resolution, tests, remainingRisk]
      properties:
        id: { type: integer }
        title: { type: string }
        attack: { type: string }
        resolution: { type: string }
        tests:
          type: array
          items: { type: string }
        remainingRisk: { type: string }
    ExportBundle:
      type: object
      required: [schemaVersion, generatedAt, mode, baselineVersion, featureOrder, decisions, trades, experiments, metaReport, csv, trainingRows]
      properties:
        schemaVersion: { type: integer }
        generatedAt: { type: string }
        mode: { type: string }
        baselineVersion: { type: string }
        featureOrder:
          type: array
          items: { type: string }
        decisions:
          type: array
          items: { $ref: "#/components/schemas/Decision" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        experiments:
          type: array
          items: { $ref: "#/components/schemas/Experiment" }
        metaReport: { type: string }
        csv: { type: string }
        trainingRows:
          type: array
          items:
            type: object
            additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

